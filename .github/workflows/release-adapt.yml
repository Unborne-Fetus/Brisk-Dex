name: Release Gate - Adapt Dex

on:
  workflow_dispatch:
  push:
    branches: [adapt-dex]

jobs:
  compat-tests:
    name: Generation 1–3 compatibility tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run compat:test
      - run: python3 tools/test_extract_data.py
      - run: python3 tools/test_indexed_art.py

  package-audit:
    name: Desktop and mobile packaging audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run release:verify
      - run: npm run android:prepare
      - run: node tools/verify_release.js --mobile

  windows:
    name: Windows installer
    needs: [compat-tests, package-audit]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: Adapt-Dex-Windows
          path: dist/*.exe
          if-no-files-found: error

  android:
    name: Android APK
    needs: [compat-tests, package-audit]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm run android:prepare
      - run: npx cap add android
      - run: node tools/patch_android.mjs
      - run: npx cap sync android
      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Adapt-Dex-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Adapt-Dex-Android
          path: Adapt-Dex-Android.apk
          if-no-files-found: error

  linux:
    name: Linux packages
    needs: [compat-tests, package-audit]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: Adapt-Dex-Linux
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  apple:
    name: macOS DMG and unsigned iOS IPA
    needs: [compat-tests, package-audit]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build macOS app
        run: npm run dist:mac
      - name: Prepare iOS web bundle
        run: npm run ios:prepare
      - name: Create iOS project
        run: npx cap add ios
      - run: npx cap sync ios
      - name: Build unsigned iPhone app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build-ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build-ios/Build/Products/Release-iphoneos/App.app Payload/AdaptDex.app
          zip -qry Adapt-Dex-iOS-Unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Adapt-Dex-Apple
          path: |
            dist/*.dmg
            Adapt-Dex-iOS-Unsigned.ipa
          if-no-files-found: error
