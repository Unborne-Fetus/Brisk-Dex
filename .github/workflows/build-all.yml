name: Build Pokemon Brisk Emerald - Windows + Android

run-name: "Build Windows + Android - ${{ inputs.request_id || github.sha }}"

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Identifier used by build.bat
        required: false
        type: string
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "LICENSE"
  pull_request:
    paths:
      - ".github/workflows/build-all.yml"
      - "tools/**"
      - "test/android/**"
      - "test/desktop/**"
      - "android-native/**"
      - "native-*.js"

jobs:
  native-windows:
    name: Build matching Brisk Emerald engine for the EXE
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Install native compiler and asset tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential git python3 pkg-config curl clang gcc-multilib libc6-dev-i386 libpng-dev libsdl2-dev gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
      - name: Compile the exact pinned Brisk Emerald source for Windows
        env:
          BRISK_NATIVE_PROFILE: brisk
        run: bash tools/build-native-expansion.sh windows
      - name: Validate source identity and Windows executable
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          pin = json.loads(Path('tools/brisk-native-source.json').read_text())
          info = json.loads(Path('native-game/win32/build-info.json').read_text())
          assert info['profile'] == 'brisk'
          assert info['brisk_commit'] == pin['brisk_commit'], 'Staged game engine is stale'
          assert info['save_layout_id'] == 0x42524b31, 'Unknown native save layout'
          for name in ('pokeemerald-native.exe', 'SDL2.dll'):
              assert (Path('native-game/win32') / name).is_file(), name
          print('Matched native engine', info['brisk_commit'])
          PY
      - name: Transfer verified game engine and replay scripts to Windows
        uses: actions/upload-artifact@v6
        with:
          name: matching-brisk-windows-game
          path: |
            native-game/win32/pokeemerald-native.exe
            native-game/win32/SDL2.dll
            native-game/win32/build-info.json
            native-src/brisk-emerald-native/tests/smoke/**
          if-no-files-found: error
          retention-days: 1

  windows:
    name: Windows installer
    needs: native-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Fetch exact-version native game for packaging
        uses: actions/download-artifact@v4
        with:
          name: matching-brisk-windows-game
          path: .
      - name: Require native gameplay and smoke-test it on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pin = Get-Content 'tools/brisk-native-source.json' -Raw | ConvertFrom-Json
          $info = Get-Content 'native-game/win32/build-info.json' -Raw | ConvertFrom-Json
          if ($info.profile -ne 'brisk' -or $info.brisk_commit -ne $pin.brisk_commit) {
            throw 'Native Brisk Emerald game revision does not match this installer'
          }
          if (-not (Test-Path 'native-game/win32/pokeemerald-native.exe')) {
            throw 'Missing actual Brisk Emerald game engine'
          }
          node tools/test_brisk_native.cjs windows
      - name: Install dependencies
        run: npm ci
      - name: Verify game and desktop regressions
        run: npm run desktop:test && npm run index:test
      - name: Verify embedded native game tab in Electron
        run: npm run desktop:ui
      - name: Verify battle effect coverage
        run: npm run battle:coverage
      - name: Smoke test online battle relay
        run: npm run battle:smoke
      - name: Build normal desktop installer
        run: npm run dist:win
      - name: Upload Windows installer
        uses: actions/upload-artifact@v6
        with:
          name: Pokemon-Brisk-Emerald-Windows
          path: dist/*.exe
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v4
      - name: Install dependencies
        run: npm ci
      - name: Test Android native trainer-script decoding and safety guards
        run: python3 -m unittest discover -s test/android -p 'test_native_*.py' -v
      - name: Verify Android bridge, save recovery and mobile UI tests
        run: node --test test/android/*.test.cjs
      - name: Prepare web bundle
        run: npm run android:prepare
      - name: Reuse checked-in Android project
        run: | 
          test -f android/app/build.gradle
          test -f android/gradlew
      - name: Patch native Android file picker
        run: node tools/patch_android.mjs
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build APK
        shell: bash
        run: |
          chmod +x android/gradlew
          cd android
          set -o pipefail
          for attempt in 1 2 3; do
            if ./gradlew assembleDebug --max-workers=2 2>&1 | tee gradle-ci.log; then
              exit 0
            fi
            if ! grep -Eiq '429|Too Many Requests|503 Service Unavailable|Read timed out' gradle-ci.log; then
              echo "::error::Gradle failed for a non-network reason; see the compiler log."
              exit 1
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Gradle dependencies are still rate-limited after three attempts."
              exit 1
            fi
            echo "::warning::Gradle dependency service throttled the build; retrying after a short backoff."
            sleep $((attempt * 30))
          done
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Pokemon-Brisk-Emerald-Android.apk
      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: Pokemon-Brisk-Emerald-Android
          path: Pokemon-Brisk-Emerald-Android.apk
          if-no-files-found: error
