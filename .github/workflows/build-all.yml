name: Build Brisk Dex - Windows + Android

run-name: "Build Windows + Android - ${{ inputs.request_id || github.sha }}"

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Identifier used by build.bat
        required: false
        type: string
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "LICENSE"

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify battle effect coverage
        run: npm run battle:coverage
      - name: Smoke test online battle relay
        run: npm run battle:smoke
      - name: Build normal desktop installer
        run: npm run dist:win
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Brisk-Dex-Windows
          path: dist/*.exe
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm ci
      - name: Prepare web bundle
        run: npm run android:prepare
      - name: Create Android project
        run: npx cap add android
      - name: Patch native Android file picker
        run: node tools/patch_android.mjs
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build APK
        shell: bash
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Brisk-Dex-Android.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Brisk-Dex-Android
          path: Brisk-Dex-Android.apk
          if-no-files-found: error
