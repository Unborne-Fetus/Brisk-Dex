name: Refresh Brisk Dex Data

on:
  workflow_dispatch:
  push:
    branches: [main, android-apk]
    paths:
      - "tools/extract_data.py"
      - ".github/workflows/refresh-brisk-data.yml"

permissions:
  contents: write

concurrency:
  group: refresh-brisk-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Brisk Dex
        uses: actions/checkout@v4
        with:
          path: brisk-dex

      - name: Check out Brisk Emerald
        uses: actions/checkout@v4
        with:
          repository: Unborne-Fetus/Pokemon-Brisk-Emerald
          ref: master
          path: brisk-emerald

      - name: Install sprite tools
        run: python3 -m pip install --disable-pip-version-check pillow

      - name: Regenerate source-backed data
        working-directory: brisk-dex
        run: python3 tools/extract_data.py "$GITHUB_WORKSPACE/brisk-emerald"

      - name: Verify online battle effect coverage
        working-directory: brisk-dex
        run: npm run battle:coverage

      - name: Commit refreshed JSON
        working-directory: brisk-dex
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brisk-dex-data.json brisk-dex-trainer-teams.json brisk-battle-effects.json brisk-dex-icons brisk-dex-trainers brisk-dex-items brisk-dex-trainer-pics brisk-dex-sprites brisk-dex-cries
          if git diff --cached --quiet; then
            echo "Brisk Dex data is already current."
            exit 0
          fi
          git commit -m "Refresh Brisk Emerald reference data"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
