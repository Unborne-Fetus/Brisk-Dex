name: Cross-platform trading smoke test
on:
  push:
    branches: [main]
    paths:
      - 'battle-server.js'
      - 'index.html'
      - 'android-bridge-src.js'
      - 'brisk-dex-data.json'
      - 'tools/test_battle_server.js'
      - '.github/workflows/trading-smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - 'battle-server.js'
      - 'index.html'
      - 'android-bridge-src.js'
      - 'brisk-dex-data.json'
      - 'tools/test_battle_server.js'
      - '.github/workflows/trading-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check relay syntax and run protocol tests
        run: |
          node --check battle-server.js
          node tools/test_battle_server.js
