name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - android-apk
    paths:
      - "index.html"
      - "package.json"
      - "capacitor.config.json"
      - "android-bridge-src.js"
      - "brisk-dex-data.json"
      - "brisk-dex-trainer-teams.json"
      - "brisk-dex-icons/**"
      - "brisk-dex-trainers/**"
      - "brisk-dex-items/**"
      - "brisk-dex-trainer-pics/**"
      - "brisk-dex-sprites/**"
      - "tools/prepare_android.mjs"
      - ".github/workflows/build-ios.yml"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Prepare Brisk Dex web bundle
        run: npm run ios:prepare

      - name: Create iOS project
        run: npx cap add ios

      - name: Sync Capacitor plugins and assets
        run: npx cap sync ios

      - name: Build unsigned iPhone app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build-ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build-ios/Build/Products/Release-iphoneos/App.app Payload/BriskDex.app
          zip -qry Brisk-Dex-iOS-Unsigned.ipa Payload
          ditto -c -k --sequesterRsrc --keepParent build-ios/Build/Products/Release-iphoneos/App.app Brisk-Dex-iOS-App.zip

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Brisk-Dex-iOS-Unsigned
          path: |
            Brisk-Dex-iOS-Unsigned.ipa
            Brisk-Dex-iOS-App.zip
          if-no-files-found: error
