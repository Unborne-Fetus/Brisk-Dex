name: Deploy Adapt Dex Web
on:
  push:
    branches: [adapt-dex]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: adapt-dex-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate browser distribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install and run compatibility tests
        run: |
          npm ci
          npm run compat:test
      - name: Assemble static site
        run: |
          npm run web:build
          npm run web:verify
      - name: Save downloadable website artifact
        uses: actions/upload-artifact@v4
        with:
          name: Adapt-Dex-Web-Site
          path: web-dist/
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./web-dist

  deploy:
    name: Publish GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: adapt-dex-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
