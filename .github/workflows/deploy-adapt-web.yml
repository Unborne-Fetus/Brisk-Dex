name: Deploy Adapt Dex Web
on:
  push:
    branches: [adapt-dex]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: adapt-dex-pages
  cancel-in-progress: true
jobs:
  deploy:
    name: Build and publish browser version
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install and run compatibility tests
        run: |
          npm ci
          npm run compat:test
      - name: Assemble standalone website
        run: |
          npm run web:build
          npm run web:verify
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./web-dist
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
