name: Publish Brisk Dex Web

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'asset-loader.js'
      - 'localization.js'
      - 'brisk-dex-data.json'
      - 'brisk-dex-trainer-teams.json'
      - 'brisk-dex-icons/**'
      - 'brisk-dex-items/**'
      - 'brisk-dex-sprites/**'
      - 'brisk-dex-asset-patches/**'
      - 'brisk-dex-trainers/**'
      - 'brisk-dex-trainer-pics/**'
      - 'brisk-dex-cries/**'
      - 'tools/build_web.mjs'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: brisk-web-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build standalone web edition
        run: node tools/build_web.mjs
      - name: Check generated site
        run: |
          test -s web-dist/index.html
          test -s web-dist/brisk-dex-data.json
          test -s web-dist/brisk-dex-icon-manifest.json
          test -s web-dist/asset-loader.js
          test -s web-dist/localization.js
      - uses: actions/upload-artifact@v4
        with:
          name: Brisk-Dex-Web
          path: web-dist/
          include-hidden-files: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-dist/
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
