name: Embedded expansion native bridge
on:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'test/desktop/**'
      - 'native-*.js'
      - 'main.js'
      - 'preload.js'
      - '.github/workflows/embedded-native.yml'
  pull_request:
    paths:
      - 'main.js'
      - 'preload.js'
      - 'native-embedded.js'
      - 'native-game/**'
      - 'index.html'
      - 'tools/build-native-expansion.sh'
      - 'tools/setup-native-deps.sh'
      - 'tools/build_integrated_windows.ps1'
      - 'tools/test_wsl_line_endings.sh'
      - '.gitattributes'
      - 'tools/patch-native-stream.py'
      - 'tools/patch-native-compat.py'
      - 'tools/native-stdio.h'
      - 'test/desktop/**'
      - 'package.json'
      - '.github/workflows/embedded-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  companion:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: python3 tools/patch-native-stream.py --self-test
      - run: python3 tools/test_native_compat.py
      - run: bash -n tools/build-native-expansion.sh tools/setup-native-deps.sh
      - run: bash tools/test_wsl_line_endings.sh
      - run: node --check main.js && node --check native-embedded.js && node --check preload.js
      - run: npm run desktop:test
      - run: npm run index:test
  native-linux-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential git python3 pkg-config curl clang gcc-multilib libc6-dev-i386 libpng-dev libsdl2-dev
      - name: Compile real expansion source with embedded frame/input hooks
        run: bash tools/build-native-expansion.sh linux
      - name: Smoke test embedded frame transport and native startup
        run: node tools/test_native_stream.cjs

  native-windows-cross-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Native Windows cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential git python3 pkg-config curl clang gcc-multilib libc6-dev-i386 libpng-dev libsdl2-dev gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
      - name: Check C99 size formats with the installed MinGW compiler
        run: |
          printf '#include <stddef.h>\nvoid checked(const char *, ...) __attribute__((format(printf, 1, 2)));\nvoid checked_gnu(const char *, ...) __attribute__((format(gnu_printf, 1, 2)));\nint main(void) { size_t n = 1; checked_gnu("%%zu %%llu", n, (unsigned long long)n); return fprintf(stderr, "%%#zx %%zu", n, n) < 0; }\n' > /tmp/brisk-stdio-probe.c
          x86_64-w64-mingw32-gcc --version | head -1
          x86_64-w64-mingw32-gcc -std=gnu17 -Wall -Wextra -Werror -D__USE_MINGW_ANSI_STDIO=1 -include tools/native-stdio.h -c /tmp/brisk-stdio-probe.c -o /tmp/brisk-stdio-probe.o
      - name: Cross-compile embedded Windows engine
        run: bash tools/build-native-expansion.sh windows
      - name: Confirm private bundled Windows game dependencies exist
        run: |
          test -s native-game/win32/pokeemerald-native.exe
          test -s native-game/win32/SDL2.dll

  desktop-windows-ui:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check Windows integrated build script syntax
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'tools/build_integrated_windows.ps1'),
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors) { throw ($parseErrors | Out-String) }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run desktop:test
      - run: npm run desktop:ui
