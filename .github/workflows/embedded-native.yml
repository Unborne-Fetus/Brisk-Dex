name: Embedded expansion native bridge
# Publish only the latest validated source revision. Older builds that are
# superseded by new commits should not keep the update channel blocked.
concurrency:
  group: brisk-native-latest-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
on:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'test/desktop/**'
      - 'native-*.js'
      - 'index.html'
      - 'package.json'
      - 'update-bootstrap.js'
      - 'main.js'
      - 'preload.js'
      - '.github/workflows/embedded-native.yml'
  pull_request:
    paths:
      - 'main.js'
      - 'preload.js'
      - 'native-*.js'
      - 'native-game/**'
      - 'index.html'
      - 'tools/build-native-expansion.sh'
      - 'tools/setup-native-deps.sh'
      - 'tools/build_integrated_windows.ps1'
      - 'tools/test_wsl_line_endings.sh'
      - '.gitattributes'
      - 'tools/patch-native-stream.py'
      - 'tools/patch-native-compat.py'
      - 'tools/native-stdio.h'
      - 'tools/native_pe_imports.py'
      - 'tools/test_native_pe.py'
      - 'test/desktop/**'
      - 'package.json'
      - '.github/workflows/embedded-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  companion:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: python3 tools/patch-native-stream.py --self-test
      - run: python3 tools/test_native_compat.py
      - run: python3 tools/test_native_pe.py
      - run: python3 tools/test_prepare_brisk_native.py
      - run: bash -n tools/build-native-expansion.sh tools/setup-native-deps.sh
      - run: bash tools/test_wsl_line_endings.sh
      - run: node --check main.js && node --check native-embedded.js && node --check preload.js
      - run: npm run desktop:test
      - run: npm run index:test
  native-linux-build:
    env:
      BRISK_NATIVE_PROFILE: expansion
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential git python3 pkg-config curl clang gcc-multilib libc6-dev-i386 libpng-dev libsdl2-dev
      - name: Compile real expansion source with embedded frame/input hooks
        run: bash tools/build-native-expansion.sh linux
      - name: Smoke test embedded frame transport and native startup
        run: node tools/test_native_stream.cjs

  native-windows-cross-build:
    env:
      BRISK_NATIVE_PROFILE: expansion
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Native Windows cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential git python3 pkg-config curl clang gcc-multilib libc6-dev-i386 libpng-dev libsdl2-dev gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
      - name: Check C99 size formats with the installed MinGW compiler
        run: |
          printf '#include <stddef.h>\nvoid checked(const char *, ...) __attribute__((format(printf, 1, 2)));\nvoid checked_gnu(const char *, ...) __attribute__((format(gnu_printf, 1, 2)));\nint main(void) { size_t n = 1; checked_gnu("%%zu %%llu", n, (unsigned long long)n); return fprintf(stderr, "%%#zx %%zu", n, n) < 0; }\n' > /tmp/brisk-stdio-probe.c
          x86_64-w64-mingw32-gcc --version | head -1
          x86_64-w64-mingw32-gcc -std=gnu17 -Wall -Wextra -Werror -D__USE_MINGW_ANSI_STDIO=1 -include tools/native-stdio.h -c /tmp/brisk-stdio-probe.c -o /tmp/brisk-stdio-probe.o
      - name: Check the Windows host API declarations with older MinGW headers
        run: |
          cat > /tmp/brisk-winapi-probe.c <<'EOF'
          #include <windows.h>
          int main(void) {
              ULONG_PTR low, high;
              STARTUPINFOEXW info = {0};
              GetCurrentThreadStackLimits(&low, &high);
              return (int)(GetTickCount64() + GetErrorMode() + info.StartupInfo.cb);
          }
          EOF
          x86_64-w64-mingw32-gcc -std=gnu17 -Wall -Wextra -Werror -D_WIN32_WINNT=0x0A00 -DWINVER=0x0A00 -c /tmp/brisk-winapi-probe.c -o /tmp/brisk-winapi-probe.o
      - name: Cross-compile embedded Windows engine
        run: bash tools/build-native-expansion.sh windows
      - name: Reproduce and repair the reported import-section layout failure
        run: python3 tools/test_native_pe.py native-game/win32/pokeemerald-native.exe native-src/pokeemerald-expansion-native/platform/build_glue/check_pe_layout.py
      - name: Confirm private bundled Windows game dependencies exist
        run: |
          test -s native-game/win32/pokeemerald-native.exe
          test -s native-game/win32/SDL2.dll

  desktop-windows-ui:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check Windows integrated build script syntax
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'tools/build_integrated_windows.ps1'),
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors) { throw ($parseErrors | Out-String) }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run desktop:test
      - run: npm run desktop:ui
      - run: npx playwright install chromium
      - run: npm run native:ui

  brisk-native-build:
    concurrency:
      group: brisk-runtime-updates-${{ matrix.target }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        target: [linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential git python3 pkg-config curl clang gcc-multilib libc6-dev-i386 libpng-dev libsdl2-dev gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
      - name: Restore validated Linux Brisk runtime for replay checks
        if: matrix.target == 'linux'
        id: brisk-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            native-game/linux
            native-src/brisk-emerald-native/tests/smoke
          key: brisk-linux-${{ runner.os }}-${{ hashFiles('tools/build-native-expansion.sh', 'tools/brisk-native-source.json', 'tools/brisk-native-port.patch', 'tools/prepare_brisk_native.py', 'tools/patch-native-stream.py', 'tools/patch-native-compat.py', 'tools/native-stdio.h', 'tools/native_build_info.py') }}
      - name: Build the complete Brisk Emerald source port
        if: matrix.target != 'linux' || steps.brisk-cache.outputs.cache-hit != 'true'
        env:
          BRISK_NATIVE_PROFILE: brisk
        run: bash tools/build-native-expansion.sh ${{ matrix.target }}
      - name: Cache the compiled Linux engine before gameplay checks
        if: matrix.target == 'linux' && steps.brisk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            native-game/linux
            native-src/brisk-emerald-native/tests/smoke
          key: ${{ steps.brisk-cache.outputs.cache-primary-key }}
      - name: Start the Brisk native engine and verify embedded frames
        if: matrix.target == 'linux'
        run: node tools/test_native_stream.cjs
      - name: Native replay debugger
        if: matrix.target == 'linux'
        run: sudo apt-get install -y --no-install-recommends gdb
      - name: Play through Brisk's opening, save, reload, and profile selection
        if: matrix.target == 'linux'
        env:
          BRISK_REPLAY_DEBUG: '1'
        run: node tools/test_brisk_native.cjs
      - name: Preserve failed Linux visual replay for inspection
        if: failure() && matrix.target == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: brisk-linux-visual-diagnostics
          path: |
            native-game/linux
            native-diagnostics
          retention-days: 1
      - name: Validate Brisk's native Windows executable layout
        if: matrix.target == 'windows'
        run: python3 tools/test_native_pe.py native-game/win32/pokeemerald-native.exe native-src/brisk-emerald-native/platform/build_glue/check_pe_layout.py

      - name: Stage Windows engine for a real Windows gameplay replay
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: brisk-windows-replay
          path: |
            native-game/win32/pokeemerald-native.exe
            native-game/win32/SDL2.dll
            native-game/win32/pokeemerald-native.exe.symbols
            native-src/brisk-emerald-native/tests/smoke
          retention-days: 1
      - name: Build a validated downloadable game update
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        run: |
          platform=linux
          if [ "${{ matrix.target }}" = windows ]; then platform=win32; fi
          node tools/build_update_bundle.cjs "$platform" update-dist
      - name: Stage validated update bundle
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: brisk-runtime-${{ matrix.target }}
          path: update-dist/*
          retention-days: 1

  brisk-windows-replay:
    needs: brisk-native-build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: brisk-windows-replay
          path: .
      - name: Verify Windows graphics, opening, battle and both save profiles
        run: node tools/test_brisk_native.cjs windows

  publish-runtime-updates:
    needs: [brisk-native-build, brisk-windows-replay, companion, desktop-windows-ui]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: brisk-runtime-channel-publish
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: brisk-runtime-*
          path: update-dist
          merge-multiple: true
      - name: Publish update channel without requiring a new installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          current=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          if [ "$current" != "$GITHUB_SHA" ]; then echo 'A newer main revision superseded this build'; exit 0; fi
          if ! gh release view updates >/dev/null 2>&1; then
            gh release create updates --target main --title "Pokemon Brisk Emerald automatic updates" --notes "Downloadable runtime and content updates for the desktop app." --prerelease
          fi
          gh release upload updates update-dist/runtime-*.json.gz --clobber
          gh release upload updates update-dist/latest-*.json --clobber
