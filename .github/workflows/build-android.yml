# Latest Brisk Dex Android build - trainer/location cleanup
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "package.json"
      - "capacitor.config.json"
      - "android-bridge-src.js"
      - "brisk-dex-data.json"
      - "brisk-dex-trainer-teams.json"
      - "brisk-dex-trainer-flags.json"
      - "brisk-dex-icons/**"
      - "brisk-dex-trainers/**"
      - "brisk-dex-sprites/**"
      - "brisk-dex-trainer-pics/**"
      - "brisk-dex-items/**"
      - "tools/prepare_android.mjs"
      - ".github/workflows/build-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Test Android native trainer-script decoding and safety guards
        run: python3 -m unittest discover -s test/android -p 'test_native_*.py' -v
      - name: Prepare Brisk Dex web bundle
        run: npm run android:prepare

      - name: Reuse checked-in Android project
        run: | 
          test -f android/app/build.gradle
          test -f android/gradlew

      - name: Patch native Android file picker
        run: node tools/patch_android.mjs

      - name: Sync Capacitor plugins and assets
        run: npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Brisk-Dex-Android.apk

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: Brisk-Dex-Android
          path: Brisk-Dex-Android.apk
          if-no-files-found: error

  publish-preview:
    name: Publish validated Android preview APK
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download successful Android APK
        uses: actions/download-artifact@v4
        with:
          name: Brisk-Dex-Android
          path: release
      - name: Publish APK as a GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test -s release/Brisk-Dex-Android.apk
          tag="android-preview-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" release/Brisk-Dex-Android.apk \
            --target "$GITHUB_SHA" \
            --title "Brisk Dex Android preview ${GITHUB_RUN_NUMBER} (crash-fix testing)" \
            --notes "Automated Android APK from a successful CI build, revision ${GITHUB_SHA}. Includes tests for native trainer script handling. PREVIEW: the native game still requires device testing for follower battles, May's post-battle script, and Rock Slide. This is a debug-signed APK; its signing certificate may differ from older builds, so in-place installation is not guaranteed. Back up your game save before changing APKs. The existing android-updates channel is unchanged." \
            --prerelease
