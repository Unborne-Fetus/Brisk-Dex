# Latest Brisk Dex Android build - trainer/location cleanup
name: Build integrated Android APK

concurrency:
  group: brisk-integrated-android-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "package.json"
      - "capacitor.config.json"
      - "android-bridge-src.js"
      - "native-settings-ui.js"
      - "native-controls.js"
      - "localization.js"
      - "asset-loader.js"
      - "game/**"
      - "brisk-dex-cries/**"
      - "brisk-dex-asset-patches/**"
      - "brisk-dex-icon-manifest.json"
      - "brisk-dex-data.json"
      - "brisk-dex-trainer-teams.json"
      - "brisk-dex-trainer-flags.json"
      - "brisk-dex-icons/**"
      - "brisk-dex-trainers/**"
      - "brisk-dex-sprites/**"
      - "brisk-dex-trainer-pics/**"
      - "brisk-dex-items/**"
      - "tools/**android*"
      - "tools/Makefile.android"
      - "tools/brisk-native-source.json"
      - "tools/prepare_brisk_native.py"
      - "tools/prepare_android.mjs"
      - "tools/set_android_version.mjs"
      - "android/**"
      - "android-native/**"
      - "test/android/**"
      - ".github/workflows/build-android.yml"

jobs:
  build:
    outputs:
      channel_signing: ${{ steps.signing.outputs.channel_signing }}
      game_integrated: ${{ steps.game.outputs.game_integrated }}
    runs-on: ubuntu-latest
    timeout-minutes: 110

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm ci --prefer-offline --fetch-retries=4 2>&1 | tee npm-ci.log; then
              exit 0
            fi
            if ! grep -Eiq 'ECONNRESET|ETIMEDOUT|EAI_AGAIN|E429|E503' npm-ci.log || [ "$attempt" = 3 ]; then
              exit 1
            fi
            sleep "$((attempt * 20))"
          done
      - name: Verify native shell scripts before compiling
        run: |
          bash -n tools/build_android_game_archive.sh
          bash -n tools/package_android_full_game.sh

      - name: Test Android native trainer-script decoding and safety guards
        run: python3 -m unittest discover -s test/android -p 'test_native_*.py' -v
      - name: Verify Android native bridge, saves, and lifecycle tests
        run: node --test test/android/*.test.cjs
      - name: Prepare Brisk Dex web bundle
        run: npm run android:prepare

      - name: Reuse checked-in Android project
        run: | 
          test -f android/app/build.gradle
          test -f android/gradlew

      - name: Install native compiler and asset tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential git python3 pkg-config curl clang gcc-multilib libc6-dev-i386 libpng-dev libsdl2-dev binutils-aarch64-linux-gnu

      - name: Install pinned Android NDK and CMake
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$sdk"
          sdkmanager=""
          for candidate in "$sdk"/cmdline-tools/*/bin/sdkmanager; do
            if [ -x "$candidate" ]; then sdkmanager="$candidate"; break; fi
          done
          test -n "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" 'ndk;27.2.12479018' 'cmake;3.22.1'
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"

      - name: Checkout matching SDL2 and compile the real ARM64 game
        run: |
          set -euo pipefail
          git clone --depth 1 --branch release-2.30.12 https://github.com/libsdl-org/SDL.git "$RUNNER_TEMP/brisk-android-sdl2"
          export BRISK_ANDROID_SDL2_SOURCE="$RUNNER_TEMP/brisk-android-sdl2"
          export BRISK_ANDROID_JOBS=2
          bash tools/build_android_game_archive.sh
          archive="$GITHUB_WORKSPACE/native-src/brisk-emerald-native-android/build/android-arm64/libbrisk-game-arm64.a"
          test -s "$archive"
          echo "BRISK_ANDROID_GAME_ARCHIVE=$archive" >> "$GITHUB_ENV"
          echo "BRISK_ANDROID_SDL2_SOURCE=$BRISK_ANDROID_SDL2_SOURCE" >> "$GITHUB_ENV"

      - name: Patch native Android integration with the full game
        run: node tools/patch_android.mjs

      - name: Sync Capacitor plugins and assets
        run: npx cap sync android

      - name: Assign a forward-only Android version
        run: node tools/set_android_version.mjs "$GITHUB_RUN_NUMBER"

      - name: Configure matching update-channel signer when supplied
        id: signing
        shell: bash
        env:
          BRISK_ANDROID_KEYSTORE_BASE64: ${{ secrets.BRISK_ANDROID_KEYSTORE_BASE64 }}
          BRISK_ANDROID_STORE_PASSWORD: ${{ secrets.BRISK_ANDROID_STORE_PASSWORD }}
          BRISK_ANDROID_KEY_PASSWORD: ${{ secrets.BRISK_ANDROID_KEY_PASSWORD }}
          BRISK_ANDROID_KEY_ALIAS: ${{ secrets.BRISK_ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "$BRISK_ANDROID_KEYSTORE_BASE64" ]; then
            echo "channel_signing=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No stable Android signer configured; publish preview only, never the in-app channel."
            exit 0
          fi
          if [ -z "$BRISK_ANDROID_STORE_PASSWORD" ] || [ -z "$BRISK_ANDROID_KEY_PASSWORD" ] || [ -z "$BRISK_ANDROID_KEY_ALIAS" ]; then
            echo "::error::Android signing secrets are incomplete; refusing to build an unverified channel update."
            exit 1
          fi
          mkdir -p android/.secure
          printf '%s' "$BRISK_ANDROID_KEYSTORE_BASE64" | base64 --decode > android/.secure/channel.jks
          chmod 600 android/.secure/channel.jks
          # An APK can update the existing installation only when it uses the
          # exact trusted signing key. Refuse accidental certificate rotation.
          expected="$(tr -d '[:space:]' < tools/android-channel-cert.sha256)"
          actual="$(keytool -list -v -keystore android/.secure/channel.jks \
            -storepass "$BRISK_ANDROID_STORE_PASSWORD" \
            -alias "$BRISK_ANDROID_KEY_ALIAS" |
            sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1 |
            tr -d ':' | tr '[:upper:]' '[:lower:]')"
          if [ -z "$actual" ] || [ "$actual" != "$expected" ]; then
            echo "::error::Signing key differs from existing android-updates installation. Keep the original certificate or use a safe save-backup/reinstall migration."
            exit 1
          fi
          cat >> android/app/build.gradle <<'GRADLE'

          // CI only: use the already trusted Android update-channel certificate.
          android.signingConfigs.debug.storeFile = file("../.secure/channel.jks")
          android.signingConfigs.debug.storePassword = System.getenv("BRISK_ANDROID_STORE_PASSWORD")
          android.signingConfigs.debug.keyAlias = System.getenv("BRISK_ANDROID_KEY_ALIAS")
          android.signingConfigs.debug.keyPassword = System.getenv("BRISK_ANDROID_KEY_PASSWORD")
          GRADLE
          echo "channel_signing=true" >> "$GITHUB_OUTPUT"

      - name: Build Android APK
        env:
          BRISK_ANDROID_STORE_PASSWORD: ${{ secrets.BRISK_ANDROID_STORE_PASSWORD }}
          BRISK_ANDROID_KEY_PASSWORD: ${{ secrets.BRISK_ANDROID_KEY_PASSWORD }}
          BRISK_ANDROID_KEY_ALIAS: ${{ secrets.BRISK_ANDROID_KEY_ALIAS }}
        run: |
          chmod +x android/gradlew
          cd android
          set -o pipefail
          for attempt in 1 2 3; do
            if ./gradlew assembleDebug --max-workers=2 2>&1 | tee gradle-ci.log; then
              exit 0
            fi
            if ! grep -Eiq '429|Too Many Requests|503 Service Unavailable|Read timed out' gradle-ci.log; then
              echo "::error::Gradle failed for a non-network reason; see the compiler log."
              exit 1
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Gradle dependencies are still rate-limited after three attempts."
              exit 1
            fi
            echo "::warning::Gradle dependency service throttled the build; retrying after a short backoff."
            sleep $((attempt * 30))
          done

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Brisk-Dex-Android.apk

      - name: Verify resulting APK signer matches the existing channel
        if: steps.signing.outputs.channel_signing == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sdk_tools="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}/build-tools"
          apksigner="$(find "$sdk_tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          expected="$(tr -d '[:space:]' < tools/android-channel-cert.sha256)"
          actual="$("$apksigner" verify --print-certs Brisk-Dex-Android.apk |
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 |
            tr '[:upper:]' '[:lower:]')"
          if [ -z "$actual" ] || [ "$actual" != "$expected" ]; then
            echo "::error::Built APK is not signed by the established Android update certificate."
            exit 1
          fi

      - name: Generate integrity-checked update manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          apk = Path("Brisk-Dex-Android.apk")
          data = json.loads(Path("android-build-version.json").read_text())
          with apk.open("rb") as stream:
              data["sha256"] = hashlib.file_digest(stream, "sha256").hexdigest()
          data["bytes"] = apk.stat().st_size
          Path("android-update.json").write_text(json.dumps(data, indent=2) + "\n")
          print(f"APK {data['versionName']} (code {data['versionCode']}), {data['bytes']} bytes")
          PY

      - name: Inspect native APK contents and exact game-source identity
        id: game
        shell: bash
        run: |
          pin="$(python3 -c 'import json;print(json.load(open("tools/brisk-native-source.json"))["brisk_commit"])')"
          python3 tools/inspect_android_apk.py Brisk-Dex-Android.apk --expected-commit "$pin" --require-game --output android-game-status.json
          python3 - <<'PY'
          import json,os
          with open('android-game-status.json') as src:
              report=json.load(src)
          print('Native game integrated:', report['game_integrated'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('game_integrated='+str(report['game_integrated']).lower()+'\n')
          PY

      - name: Upload APK and verified manifest (authorized redistribution only)
        if: vars.BRISK_ANDROID_DISTRIBUTION_APPROVED == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: Brisk-Dex-Android
          path: |
            Brisk-Dex-Android.apk
            android-update.json
            android-game-status.json
          if-no-files-found: error

  publish-preview:
    name: Publish verified integrated Android preview
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.build.outputs.game_integrated == 'true' && vars.BRISK_ANDROID_DISTRIBUTION_APPROVED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download successful Android APK
        uses: actions/download-artifact@v4
        with:
          name: Brisk-Dex-Android
          path: release
      - name: Publish APK as a GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test -s release/Brisk-Dex-Android.apk
          tag="android-preview-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" release/Brisk-Dex-Android.apk release/android-game-status.json \
            --target "$GITHUB_SHA" \
            --title "Brisk Emerald integrated Android preview ${GITHUB_RUN_NUMBER}" \
            --notes "Automated Android APK from a successful CI build, revision ${GITHUB_SHA}. Includes tests for native trainer script handling. PREVIEW: the native game still requires device testing for follower battles, May's post-battle script, and Rock Slide. The APK was verified to contain the real ARM64 game library. Runtime and save testing are still required. This is a preview APK. In-app updates are published separately only when CI has the matching trusted signing key and confirms a newer version. In-place installation of previews may fail due to certificate differences. Back up your saved games before reinstalling." \
            --prerelease

  publish-channel:
    name: Publish only compatible in-app update
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.outputs.channel_signing == 'true' && needs.build.outputs.game_integrated == 'true' && vars.BRISK_ANDROID_DISTRIBUTION_APPROVED == 'true' && vars.BRISK_ANDROID_DEVICE_TESTS_APPROVED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: brisk-dex-android-update-channel
      cancel-in-progress: false
    steps:
      - name: Download built APK and integrity manifest
        uses: actions/download-artifact@v4
        with:
          name: Brisk-Dex-Android
          path: release
      - name: Verify new APK matches installed update-channel signature and increases version code
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p previous
          gh release download android-updates --pattern Brisk-Dex-Android.apk --dir previous
          old=previous/Brisk-Dex-Android.apk
          new=release/Brisk-Dex-Android.apk
          test -s "$old" && test -s "$new" && test -s release/android-update.json
          sdk_tools="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}/build-tools"
          apksigner="$(find "$sdk_tools" -type f -name apksigner | sort -V | tail -n 1)"
          aapt="$(find "$sdk_tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$apksigner" && test -n "$aapt"
          old_cert="$("$apksigner" verify --print-certs "$old" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          new_cert="$("$apksigner" verify --print-certs "$new" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          if [ -z "$old_cert" ] || [ "$old_cert" != "$new_cert" ]; then
            echo "::error::APK certificate differs from existing android-updates APK. Not publishing an update that would fail in-place installation."
            exit 1
          fi
          old_code="$("$aapt" dump badging "$old" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -n 1)"
          new_code="$("$aapt" dump badging "$new" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -n 1)"
          if [ -z "$old_code" ] || [ -z "$new_code" ] || [ "$new_code" -le "$old_code" ]; then
            echo "::error::APK versionCode must exceed the currently published Android update."
            exit 1
          fi
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          apk = Path("release/Brisk-Dex-Android.apk")
          manifest = json.loads(Path("release/android-update.json").read_text())
          assert manifest["bytes"] == apk.stat().st_size
          with apk.open("rb") as src:
              assert manifest["sha256"] == hashlib.file_digest(src, "sha256").hexdigest()
          print("Manifest hash and APK size verified")
          PY
      - name: Update trusted Android channel
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload android-updates release/Brisk-Dex-Android.apk --clobber
          gh release upload android-updates release/android-update.json --clobber
