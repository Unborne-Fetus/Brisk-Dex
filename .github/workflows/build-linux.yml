name: Build Linux

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "main.js"
      - "preload.js"
      - "index.html"
      - "battle-server.js"
      - "tools/check_battle_coverage.js"
      - "tools/test_battle_server.js"
      - "brisk-battle-effects.json"
      - "brisk-dex-data.json"
      - "brisk-dex-trainer-teams.json"
      - "brisk-dex-icons/**"
      - "brisk-dex-trainers/**"
      - "brisk-dex-items/**"
      - "brisk-dex-trainer-pics/**"
      - "brisk-dex-sprites/**"
      - "brisk-dex-cries/**"
      - ".github/workflows/build-linux.yml"

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Verify battle effect coverage
        run: npm run battle:coverage

      - name: Smoke test online battle relay
        run: npm run battle:smoke

      - name: Build Linux packages
        run: npm run dist:linux

      - name: Upload Linux builds
        uses: actions/upload-artifact@v4
        with:
          name: Brisk-Dex-Linux
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
