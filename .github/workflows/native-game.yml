name: Standalone game foundation
on:
  push:
    branches: [main]
    paths: ['battle-server.js', 'tools/build_native_battle.mjs', 'game/**', 'test/game/**', 'tools/import_native_maps.mjs', 'tools/serve_native_game.mjs', '.github/workflows/native-game.yml']
  pull_request:
    paths: ['battle-server.js', 'tools/build_native_battle.mjs', 'game/**', 'test/game/**', 'tools/import_native_maps.mjs', '.github/workflows/native-game.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm run game:test
      - run: npm run battle:coverage
      - run: npm run battle:smoke
